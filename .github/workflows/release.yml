name: Release

# Packages the desktop app for Linux, macOS and Windows and uploads every
# artifact to a GitHub Release with Fastforge.
#
# Push a `v*` tag — or run this workflow manually with an existing tag — to
# release. The tag has to match the version in
# `apps/desktop/flutter/pubspec.yaml`: the tag `v0.5.0` releases
# `version: 0.5.0+18`.
#
# The release is created as a draft first and only published once all three
# platforms have uploaded their artifacts, so a partially built release never
# goes live.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.5.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Keep in sync with the Flutter version used by `.github/workflows/ci.yml`.
  FLUTTER_VERSION: "3.47.5"
  # Pin the Fastforge CLI to a release (for example "0.7.0"); empty installs the latest.
  FASTFORGE_VERSION: ""
  APP_DIR: apps/desktop/flutter

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *)
              echo "::error::The release tag must start with 'v' (got '$tag')."
              exit 1
              ;;
          esac

          echo "Releasing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Check the tag against the app version
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version:[[:space:]]*//p' "$APP_DIR/pubspec.yaml" | head -n1 | tr -d "\"'")"
          build_name="${version%%+*}"

          if [ "$TAG" != "v$build_name" ] && [ "$TAG" != "v$version" ]; then
            echo "::error::$APP_DIR/pubspec.yaml is at version '$version', which does not match the release tag '$TAG'."
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "::error::The release $TAG is already published. Bump the version or delete the release first."
              exit 1
            fi
            # A previous run left a draft behind: rebuild it from scratch so the
            # asset uploads below do not collide with stale assets.
            echo "Replacing the existing draft release $TAG"
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" \
            --draft \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # `macos-latest` builds for Apple Silicon. Add a `macos-13` entry for
          # an Intel build; give it its own `{{channel}}` so the asset names
          # stay unique.
          - os: macos-latest
            platform: macos
            target: dmg
          # Ubuntu 22.04 keeps the glibc floor of the published artifacts low.
          - os: ubuntu-22.04
            platform: linux
            target: deb,appimage
          - os: windows-latest
            platform: windows
            target: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # `flutter build macos` produces a universal binary, so the native
          # assets hook compiles the Rust runtime for both architectures and
          # needs the Intel standard library next to the host one.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev

      - name: Install appimagetool
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo install -m 0755 /tmp/appimagetool /usr/local/bin/appimagetool

          # GitHub runners have no FUSE, so let the tool unpack itself instead of
          # mounting the AppImage.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress --yes

      - name: Resolve Dart dependencies
        run: dart pub get

      - name: Set up Fastforge
        if: runner.os != 'Linux'
        uses: fastforgedev/actions/setup@main
        with:
          fastforge-version: ${{ env.FASTFORGE_VERSION }}

      # Fastforge's published Linux binary links against glibc 2.39 and refuses
      # to start on this 22.04 runner:
      #
      #     fastforge: libc.so.6: version `GLIBC_2.38' not found
      #
      # so the released installer is only a first try here. When it yields a
      # binary that runs, that is the end of it; otherwise the CLI is built on
      # this runner, which links it against the runner's own glibc and keeps the
      # artifacts compatible with older distributions. Once Fastforge ships a
      # Linux binary built on ubuntu-22.04 this step turns into a no-op and can
      # be replaced by `fastforgedev/actions/setup` alone.
      - name: Set up Fastforge (Linux)
        if: runner.os == 'Linux'
        env:
          FASTFORGE_INSTALL_DIR: ${{ github.workspace }}/.fastforge/bin
        run: |
          set -euo pipefail

          mkdir -p "$FASTFORGE_INSTALL_DIR"
          installer="$(mktemp)"
          if curl -fsSL https://fastforge-web.lijy91.workers.dev/install.sh -o "$installer" \
            && FASTFORGE_INSTALL_DIR="$FASTFORGE_INSTALL_DIR" sh "$installer"; then
            if "$FASTFORGE_INSTALL_DIR/fastforge" --version >/dev/null 2>&1; then
              echo "The released Fastforge binary runs on this runner."
              echo "$FASTFORGE_INSTALL_DIR" >> "$GITHUB_PATH"
              exit 0
            fi
          fi

          echo "The released binary cannot run here; building Fastforge from source."
          # `cargo install` copies the release profile from the Fastforge
          # workspace; LTO and a single codegen unit make it needlessly slow for
          # a tool that is about to run once.
          CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 \
            cargo install \
              --git https://github.com/fastforgedev/fastforge \
              fastforge_cli \
              --locked

          fastforge --version

      - name: Package
        id: package
        uses: fastforgedev/actions/package@main
        with:
          platform: ${{ matrix.platform }}
          target: ${{ matrix.target }}
          working-directory: ${{ env.APP_DIR }}
          # Names like `beyondtranslate-0.5.0+18-macos.dmg`. The project ships no
          # `distribute_options.yaml`: the workflow is the only place that
          # configures a release (targets, artifact name, defines, publishing).
          artifact-name: "beyondtranslate-{{build_name}}+{{build_number}}-{{platform}}{{#is_installer}}-setup{{/is_installer}}{{#ext}}.{{ext}}{{/ext}}"
          # The runner starts from a clean checkout, so `flutter clean` would
          # only throw away the `dart pub get` result above.
          skip-clean: "true"
          dart-define: '{"APP_ENV":"production"}'

      - name: Publish to the GitHub Release
        uses: fastforgedev/actions/publish@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: ${{ steps.package.outputs.artifact-paths }}
          target: github
          working-directory: ${{ env.APP_DIR }}
          github-repo: ${{ github.repository }}
          github-release-title: ${{ needs.prepare.outputs.tag }}
          publish-args: '{"release-tag":"${{ needs.prepare.outputs.tag }}"}'

  publish:
    name: Publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Undraft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          # This job has no checkout, so `gh` cannot infer the repository from
          # the git remote.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      # The tap also polls for new releases every six hours; this only makes the
      # cask follow right away. `HOMEBREW_TAP_TOKEN` is a token that may run
      # workflows in beyondtranslate/homebrew-tap (fine-grained: Actions write).
      - name: Update the Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; the tap picks the release up on its next scheduled run."
            exit 0
          fi
          gh workflow run update.yml --repo beyondtranslate/homebrew-tap
