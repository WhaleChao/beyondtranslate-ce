# DMG layout (appdmg schema) for `fastforge package --target dmg`.
#
# The bundle is named after `PRODUCT_NAME` in
# `macos/Runner/Configs/AppInfo.xcconfig` (`beyondtranslate`), which is not the
# pubspec name (`beyondtranslate_desktop`), so the entry below has to spell the
# `.app` out; the built-in default would look for `beyondtranslate_desktop.app`.
title: BeyondTranslate
icon-size: 80
contents:
  - x: 448
    y: 344
    type: link
    path: "/Applications"
  - x: 192
    y: 344
    type: file
    path: beyondtranslate.app
