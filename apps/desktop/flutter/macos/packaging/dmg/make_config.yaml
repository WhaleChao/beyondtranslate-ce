# DMG layout (appdmg schema) for `fastforge package --target dmg`.
#
# The bundle is named after `APP_PRODUCT_NAME` in
# `macos/Runner/Configs/Edition.xcconfig`, which is not the pubspec name
# (`beyondtranslate_desktop`), so the entry below has to spell the `.app` out.
# Keep it in step with that file.
title: BeyondTranslate CE
icon-size: 80
contents:
  - x: 448
    y: 344
    type: link
    path: "/Applications"
  - x: 192
    y: 344
    type: file
    path: BeyondTranslate-CE.app
